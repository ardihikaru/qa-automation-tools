# qa-tool — L7 edge on the public box. MIRROR of /etc/nginx/conf.d/qa-tool.conf
# on `ssh edge-host` (203.0.113.10, WireGuard hub 10.8.0.1).
# The file ON THE BOX is the authority; this copy exists so the edge is reviewable.
# Modeled on edge-host:/etc/nginx/conf.d/ai-minimax-cli.conf.
#
# TLS ends HERE. To the private VM it is plain HTTP over WireGuard.
#
#   qa-tool.mfardiansyah.id -> 10.8.0.9:8140   qa-automation dashboard+api (app-host)
#   (public name since 2026-11-23, with its own certificate lineage.)
#
# THIS EDGE IS SHARED with many products:
#   * `map` variable names are GLOBAL across conf.d -> everything here is $qatool_.
#   * No default_server. Unknown Host -> 444.
#   * `sudo nginx -t` BEFORE `systemctl reload nginx`, always.
#   * nginx >= 1.25: `listen 443 ssl;` + `http2 on;` (the `listen ... http2` form is deprecated).
#
# Certificate (own lineage):
#   sudo certbot certonly --webroot -w /var/www/acme --cert-name qa-tool-mfardiansyah \
#     -d qa-tool.mfardiansyah.id \
#     --deploy-hook 'nginx -t && systemctl reload nginx'

map $http_upgrade $qatool_connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name qa-tool.mfardiansyah.id;

    # ACME HTTP-01 answered here, never forwarded (renewal depends on it).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name qa-tool.mfardiansyah.id;

    ssl_certificate     /etc/letsencrypt/live/qa-tool-mfardiansyah/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qa-tool-mfardiansyah/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25m;

    location / {
        proxy_pass http://10.8.0.9:8140;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $qatool_connection_upgrade;

        # AI-backed API calls can take minutes (ai-manager CLI providers).
        proxy_connect_timeout 10s;
        proxy_send_timeout    330s;
        proxy_read_timeout    330s;
    }
}
