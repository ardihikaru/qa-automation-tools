# his-v3.qa.sismedika.com — production stack on rnd-v3-vpn (WireGuard 10.10.0.9).
#
#   browser ─TLS─> clino nginx (103.127.134.25) ─WG/HTTP─> 10.10.0.9:8140 dashboard(nginx)
#                                                              ├─ /            SPA
#                                                              └─ /api,/health → backend:8080
#   backend ─WG─> MySQL   10.10.0.4:5306  (rnd-v2-vpn master-compose)
#   backend ─WG─> ai-manager 10.10.0.4:8099 (rnd-v2-vpn)
#
# Run from the repo root:
#   docker compose -f deploy/his-v3-qa/docker-compose.prod.yml --env-file deploy/his-v3-qa/.env.prod up -d --build
name: qa-automation

services:
  backend:
    build:
      context: ../../ai-backend
    image: qa-automation/backend:latest
    env_file: .env.prod
    environment:
      PORT: "8080"
      REPO_POOL_DIR: /data/repos
    volumes:
      # Product repo pool: the ONLY host path mounted into the backend (read-write so it can
      # clone/switch branches). playwright-executor on the host reads the same directory.
      - ../../repos:/data/repos
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  dashboard:
    build:
      context: ../../dashboard
      args:
        NGINX_CONF: nginx.conf.example
    image: qa-automation/dashboard:latest
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./nginx.dashboard.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Bound to the WireGuard address only: reachable from the clino edge, never from the LAN/public.
      - "${HISV3QA_BIND_IP:-10.10.0.9}:${HISV3QA_PORT:-8140}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
