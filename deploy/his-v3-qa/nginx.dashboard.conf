# Dashboard container nginx (qa-tool.sismedika.com). TLS ends on the clino edge;
# this server sees plain HTTP from 10.10.0.1 over WireGuard.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    client_max_body_size 25m;

    # Container liveness (does not depend on the backend).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    # Backend health (database + ai-manager status) — useful from the edge.
    location = /health {
        proxy_pass http://backend:8080/health;
        proxy_set_header Host $host;
    }

    # API → Go backend. AI-backed endpoints can wait on ai-manager (CLI providers ~150s).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $http_x_real_ip;
        proxy_set_header X-Forwarded-For    $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $http_x_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
