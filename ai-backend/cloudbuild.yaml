steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/qa-backend:$COMMIT_SHA', '.']

  # Push the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/qa-backend:$COMMIT_SHA']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'qa-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/qa-backend:$COMMIT_SHA'
      - '--region'
      - '$REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'PORT=8080,NODE_ENV=production,DATABASE_URL=${_DATABASE_URL},MINIMAX_API_KEY=${_MINIMAX_API_KEY},API_SECRET_KEY=${_API_SECRET_KEY}'
      - '--service-account'
      - '${_SERVICE_ACCOUNT}'

images:
  - 'gcr.io/$PROJECT_ID/qa-backend:$COMMIT_SHA'

substitutions:
  _DATABASE_URL: ''
  _MINIMAX_API_KEY: ''
  _SERVICE_ACCOUNT: ''

options:
  logging: CLOUD_LOGGING_ONLY