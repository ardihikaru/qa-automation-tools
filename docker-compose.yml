version: "3"

services:
  # React Dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: ../dashboard/Dockerfile
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - qa-network

  # Golang Backend
  backend:
    build:
      context: ./ai-backend
      dockerfile: ../ai-backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    networks:
      - qa-network

networks:
  qa-network:
    driver: bridge